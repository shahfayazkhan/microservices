# api-gateway — Deployment (runs the pods) + Service (stable DNS name + load balancing).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: shop
  labels: { app: api-gateway, part-of: shop }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } # zero-downtime deploys
  template:
    metadata:
      labels: { app: api-gateway, part-of: shop }
    spec:
      containers:
        - name: api-gateway
          image: shop/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent # use the image you built locally
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - { name: SERVICE_NAME, value: "api-gateway" }
            - { name: PORT, value: "8080" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: app-secrets, key: JWT_SECRET } }
          # startupProbe: give the app time to connect to MongoDB + Kafka before other probes start
          startupProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30
          # readinessProbe: only send traffic when DB + Kafka are connected
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5
            failureThreshold: 3
          # livenessProbe: restart the container if the process hangs
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
# LoadBalancer: on Docker Desktop this is exposed at http://localhost:8080
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: shop
  labels: { app: api-gateway }
spec:
  type: LoadBalancer
  selector: { app: api-gateway }
  ports:
    - port: 8080
      targetPort: 8080
