# user-service — Deployment (runs the pods) + Service (stable DNS name + load balancing).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: shop
  labels: { app: user-service, part-of: shop }
spec:
  replicas: 2
  selector:
    matchLabels: { app: user-service }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } # zero-downtime deploys
  template:
    metadata:
      labels: { app: user-service, part-of: shop }
    spec:
      containers:
        - name: user-service
          image: shop/user-service:1.0.0
          imagePullPolicy: IfNotPresent # use the image you built locally
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - { name: SERVICE_NAME, value: "user-service" }
            - { name: PORT, value: "3001" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: app-secrets, key: JWT_SECRET } }
            - name: ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: app-secrets, key: ADMIN_EMAIL } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: ADMIN_PASSWORD } }
            - name: MONGO_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: MONGO_ROOT_USERNAME } }
            - name: MONGO_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: MONGO_ROOT_PASSWORD } }
            # $(VAR) expands variables defined ABOVE in this list
            - name: MONGO_URI
              value: "mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@$(MONGO_HOST)/user_db?authSource=admin"
          # startupProbe: give the app time to connect to MongoDB + Kafka before other probes start
          startupProbe:
            httpGet: { path: /health, port: 3001 }
            periodSeconds: 5
            failureThreshold: 30
          # readinessProbe: only send traffic when DB + Kafka are connected
          readinessProbe:
            httpGet: { path: /ready, port: 3001 }
            periodSeconds: 5
            failureThreshold: 3
          # livenessProbe: restart the container if the process hangs
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
# Internal only (ClusterIP): reachable as http://user-service:3001 inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: shop
  labels: { app: user-service }
spec:
  type: ClusterIP
  selector: { app: user-service }
  ports:
    - port: 3001
      targetPort: 3001
